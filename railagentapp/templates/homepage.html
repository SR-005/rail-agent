<!DOCTYPE html>
<html>
<head>
    <title>RailAgent UI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        #chat-log { width: 100%; height: 400px; border: 1px solid #ccc; background: white; padding: 10px; overflow-y: scroll; margin-bottom: 10px; border-radius: 5px; }
        .user-msg { color: #0056b3; font-weight: bold; margin-bottom: 10px;}
        .bot-msg { color: #28a745; margin-bottom: 10px;}
        .sys-msg { color: #6c757d; font-style: italic; margin-bottom: 10px;}
        input[type="text"] { width: 80%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; border-radius: 5px; background: #0056b3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🚂 RailAgent Terminal</h2>
    
    <div id="chat-log"></div>
    
    <input id="chat-message-input" type="text" placeholder="Tell the agent what to do..." autofocus>
    <button id="chat-message-submit">Send</button>

    <script>
        // 1. OPEN THE WALKIE-TALKIE
        // We dynamically get the current URL and change http:// to ws://
        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/railagentapp/'
        );

        const chatLog = document.querySelector('#chat-log');

        // 2. LISTEN FOR MESSAGES FROM DJANGO
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data); // Decode the JSON
            let messageClass = 'bot-msg';
            
            if (data.type === 'system' || data.type === 'status') messageClass = 'sys-msg';
            if (data.type === 'error') messageClass = 'sys-msg'; // Could make this red later

            // Print the message to the screen
            chatLog.innerHTML += `<div class="${messageClass}">${data.message}</div>`;
            chatLog.scrollTop = chatLog.scrollHeight; // Auto-scroll to bottom
        };

        // If the server hangs up
        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
            chatLog.innerHTML += `<div class="sys-msg">❌ Connection to server lost.</div>`;
        };

        // 3. SEND MESSAGES TO DJANGO
        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value;
            
            if (message.trim() === "") return;

            // Print the user's message locally so they see what they typed
            chatLog.innerHTML += `<div class="user-msg">👤 You: ${message}</div>`;
            
            // Send the text across the WebSocket as a JSON string
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            
            messageInputDom.value = ''; // Clear the input box
        };

        // Allow pressing "Enter" to send
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.keyCode === 13) { document.querySelector('#chat-message-submit').click(); }
        };
    </script>
</body>
</html>
