<!DOCTYPE html>
<html>
<head>
    <title>Register - RailAgent AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gradient: radial-gradient(circle at 50% 0%, #16192b 0%, #08090d 100%); --glass-bg: rgba(23, 25, 38, 0.45); --glass-border: rgba(255, 255, 255, 0.06); --text-main: #f3f4f6; --text-muted: #9ca3af; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .auth-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; width: 100%; max-width: 600px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); text-align: center; animation: fadeIn 0.8s ease; }
        h2 { font-family: 'Space Grotesk', sans-serif; font-size: 2.2em; margin: 0 0 10px 0; background: linear-gradient(180deg, #ffffff 30%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-bottom: 20px;}
        .full-width { grid-column: span 2; }
        .section-title { grid-column: span 2; margin: 10px 0 5px 0; color: #c084fc; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px;}
        input, select { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: white; font-family: inherit; font-size: 0.95em; box-sizing: border-box; outline: none; transition: 0.3s; }
        select option { background: #16192b; color: white; }
        input:focus, select:focus { border-color: rgba(189, 65, 255, 0.81); box-shadow: 0 0 15px rgba(189, 65, 255, 0.15); }
        button { width: 100%; padding: 16px; border-radius: 14px; background: linear-gradient(135deg, #b554fb 0%, #6c01a6 100%); color: white; border: none; font-weight: 700; font-size: 1.1em; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(156, 34, 238, 0.25); }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(55, 2, 74, 0.4); }
        .error { color: #ff6b6b; font-size: 0.9em; margin-bottom: 20px; background: rgba(255, 107, 107, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 107, 107, 0.2); }
        .link { margin-top: 25px; display: block; color: var(--text-muted); font-size: 0.9em; text-decoration: none; transition: 0.2s; }
        .link span { color: #c084fc; font-weight: 600; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Account Registration</h2>
        <p>Create your operator profile and primary traveler profile</p>

        {% if error %} <div class="error">⚠️ {{ error }}</div> {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-grid">
                <div class="section-title">Account Credentials</div>
                <input type="text" name="username" placeholder="Username" class="full-width" required>
                <input type="email" name="email" placeholder="Alert Email Address" class="full-width" required>
                <input type="password" name="password" placeholder="Password" class="full-width" required>

                <div class="section-title" style="margin-top: 10px;">Primary Traveler Details</div>
                <input type="text" name="full_name" placeholder="Full Name as per ID" class="full-width" required>
                <input type="number" name="age" placeholder="Age" required>
                <select name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <select name="berth" class="full-width" required>
                    <option value="NO">No Berth Preference</option>
                    <option value="LB">Lower Berth</option>
                    <option value="MB">Middle Berth</option>
                    <option value="UB">Upper Berth</option>
                    <option value="SL">Side Lower</option>
                </select>
            </div>
            <button type="submit">Create Profile</button>
        </form>
        <a href="{% url 'login' %}" class="link">Already have an Account? <span>Login</span></a>
    </div>
</body>
</html>
