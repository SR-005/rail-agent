<!DOCTYPE html>
<html>
<head><title>Login - RailAgent</title></head>
<body style="font-family: Arial; padding: 50px; text-align: center; background-color: #f4f4f9;">
    <h2>🚂 Login to RailAgent</h2>
    <form method="POST" style="background: white; padding: 20px; border-radius: 8px; display: inline-block; border: 1px solid #ccc;">
        {% csrf_token %}
        <p style="color: red;">{{ error }}</p>
        <input type="text" name="username" placeholder="Username" required style="padding: 10px; margin: 5px;"><br>
        <input type="password" name="password" placeholder="Password" required style="padding: 10px; margin: 5px;"><br>
        <button type="submit" style="padding: 10px 20px; background: #0056b3; color: white; border: none; border-radius: 5px; margin-top: 10px;">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</body>
</html>
